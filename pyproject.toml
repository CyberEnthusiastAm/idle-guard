[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idle-guard"
version = "0.1.0"
description = "Automated tool to detect and stop idle cloud resources (e.g., development VMs) to save costs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "IT Engineer & Open Source Contributor"}
]
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.34.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
idle-guard = "idle_guard.cli:cli"

[project.urls]
Homepage = "https://github.com/CyberEnthusiastAm/idle-guard"
Repository = "https://github.com/CyberEnthusiastAm/idle-guard"
Issues = "https://github.com/CyberEnthusiastAm/idle-guard/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
idle_guard = ["*.yaml"]